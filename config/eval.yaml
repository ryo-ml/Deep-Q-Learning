defaults:
  - config
  - override hydra/job_logging: stdout
  - _self_

eval:
  # checkpoint file, or a run directory (the latest checkpoint is used)
  # e.g. eval.ckpt=outputs/double_dqn/2026-11-13_15-00-00
  ckpt: ???
  episode: 10
  render: false  # true: show the game in a window (needs a display; fails on a server)

# evaluation saves nothing: do not create an output directory
hydra:
  run:
    dir: .
  output_subdir: null
