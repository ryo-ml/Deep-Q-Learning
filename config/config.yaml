seed: 42
device: mps

env:
  name: ALE/Breakout-v5
  frameskip: 4                   # paper: 4 (applied by AtariPreprocessing, which max-pools the last 2 frames)
  repeat_action_probability: 0.0 # paper: 0.0 (no sticky actions); ALE v5 default is 0.25

agent:
  name: double_dqn # dqn / target_dqn / double_dqn
  epsilon_start: 1.0
  epsilon_end: 0.1
  epsilon_annealing: 1000000 # paper: 1000000
  gamma: 0.99

# built with hydra.utils.instantiate (_target_ is the class; the other keys are its arguments)
loss:
  _target_: torch.nn.HuberLoss

optimizer:
  _target_: torch.optim.RMSprop
  lr: 0.00025
  alpha: 0.95
  eps: 0.01

replay_buffer:
  capacity: 1000000 # paper: 1000000
  batch_size: 32

train:
  total_steps: 50000000 # paper: 50000000
  n_fixed_states: 1000
  warmup_steps: 50000
  log_interval: 5000
  valid_interval: 1000000 # paper: 1000000
  save_interval: 100000
  update_interval: 4
  target_update_interval: 10000 # paper: 10000 (used by target_dqn / double_dqn only)

hydra:
  run:
    dir: outputs/${agent.name}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}_${agent.name}
  job_logging:
    formatters:
      simple:
        format: '%(asctime)s [%(name)s] [%(levelname)s] %(message)s'
        datefmt: '%H:%M:%S'
